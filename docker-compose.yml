services:
  db:
    image: postgres:18-alpine
    container_name: db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/up:/docker-entrypoint-initdb.d
    restart: unless-stopped
    networks:
      - net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d password" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./local/uploads:/root/uploads
      - ./local/outputs:/root/outputs
    environment:
      SERVER_PORT: 8080
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: user
      DB_PASSWORD: password
      DB_NAME: db
      DB_SSL_MODE: disable
      JWT_SECRET: a-very-secret-key-that-is-long-enough
      JWT_ACCESS_TOKEN_TTL: 15m
      JWT_REFRESH_TOKEN_TTL: 720h
      MAX_FILE_SIZE_MB: 10
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD:
      REDIS_DB: 0
      ENVIRONMENT: Production
    restart: on-failure
    networks:
      - net

  nginx:
    image: nginx:1.25-alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./web:/usr/share/nginx/html:ro
      - ./local/outputs:/usr/share/nginx/outputs:ro
    networks:
      - net
    depends_on:
      - app


volumes:
  postgres_data:
networks:
  net:
    driver: bridge
